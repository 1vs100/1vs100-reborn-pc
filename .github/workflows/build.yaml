# Builds the game for every supported platform.
#
# Chain: `codegen-key` reads the pinned SDK commit from the rexglue-sdk
# submodule and derives the cache key for the generated sources from that
# commit, the XEX hash and the codegen config files. `codegen` runs
# `rexglue codegen` only when no cache entry has that key. `build` restores
# the generated sources from the cache, then builds a platform matrix
# (linux / windows / uwp / linux-arm64 / mac-arm64 / mac-amd64).
# `package-*` repacks the build artifacts into tar.xz (linux),
# zip + Inno Setup installer (windows), per-arch .app zips (mac) and a
# signed .appx (uwp).
# Every compile goes through ccache,
# one cache per toolchain, so an unchanged SDK is not recompiled.
#
# Repository secrets:
#   XEX_URL             (required) HTTPS URL of your default.xex.
#   XEX_AUTH            (optional) sent as the `Authorization` header when
#                       downloading XEX_URL (e.g. `Bearer <token>`).
#   XEX_SHA256          (required) expected SHA-256 of default.xex; the
#                       download is verified against it and it is part of
#                       the codegen cache key.
#   CERT_PFX_B64        (optional) base64 of the code-signing certificate for
#                       the UWP appx; when unset the package is signed with a
#                       throwaway test certificate.
#   CERT_PASSWORD       (optional) password of that certificate.
#
# Fork pull requests cannot read secrets, so the secret-dependent jobs skip
# themselves there instead of failing.
#
# Layout notes:
# - Precompiled headers are disabled in CI because ccache cannot reuse them.
# - The Windows legs cross-compile from Linux with clang-cl. The desktop leg
#   needs only an xwin splat; the Store leg additionally needs an MSVC
#   install (headers/libs only, provided by mstorsjo/msvc-wine); SDL3-uwp
#   is compiled from the SDK submodule with that MSVC under Wine.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CLANG_VERSION: "22"
  XWIN_VERSION: 0.10.0
  MSVC_MAJOR: "17" # vsdownload.py manifest major; 17 == Visual Studio 2022 line
  MSVC_VERSION: "14.51.36231"
  CMAKE_VERSION: "3.28.3"
  WINSDK_VERSION_PIN: "10.0.26100.0"
  MSVC_CACHE_VERSION: v2 # bump to force a fresh MSVC download
  CMAKE_BUILD_TYPE: Release
  XWIN_ROOT: ${{ github.workspace }}/xwin-splat
  MSVC_ROOT: ${{ github.workspace }}/msvc

jobs:
  codegen-key:
    name: codegen cache key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      sdk_sha: ${{ steps.key.outputs.sdk_sha }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Check out the codegen config
        uses: actions/checkout@v7
        with:
          sparse-checkout: native

      - name: Derive the key
        id: key
        env:
          XEX_SHA256: ${{ secrets.XEX_SHA256 }}
          CONFIG_HASH: ${{ hashFiles('native/onevs100_manifest.toml', 'native/branch-targets.toml', 'native/boundaries-v3.toml', 'native/switch-fix.toml') }}
        run: |
          set -euo pipefail
          if [ -z "$XEX_SHA256" ]; then
            echo "::error::XEX_SHA256 secret is not set"
            exit 1
          fi
          sdk_sha="$(git ls-tree HEAD rexglue-sdk | awk '{ print $3 }')"
          if [ -z "$sdk_sha" ]; then
            echo "::error::rexglue-sdk submodule pointer is missing"
            exit 1
          fi
          # Job outputs that contain a secret are dropped, so hash it again.
          xex="$(printf '%s' "$XEX_SHA256" | sha256sum | cut -c1-16)"
          echo "sdk_sha=$sdk_sha" >> "$GITHUB_OUTPUT"
          echo "key=codegen-$sdk_sha-$xex-$CONFIG_HASH" >> "$GITHUB_OUTPUT"

  codegen:
    name: rexglue codegen
    needs: [codegen-key]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Look up the generated sources
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: native/generated/default-v5
          key: ${{ needs.codegen-key.outputs.key }}
          lookup-only: true

      - name: Check out the game
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        if: steps.lookup.outputs.cache-hit != 'true'
        # The rexglue codegen tool builds from the Linux desktop SDK tree, so
        # this job needs the same SDL system dependencies as the linux leg.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config python3 python3-pip \
            libx11-dev libx11-xcb-dev libxext-dev libxcursor-dev libxrandr-dev \
            libxfixes-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libxtst-dev libxdamage-dev libxrender-dev libxxf86vm-dev \
            libxcomposite-dev libibus-1.0-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev
      - name: Pin CMake
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          bindir="$(python3 -c 'import os,site; print(os.path.join(site.getuserbase(), "bin"))')"
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user "cmake==$CMAKE_VERSION"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/cmake" --version

      - name: Set up Clang
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-clang
        with:
          version: ${{ env.CLANG_VERSION }}

      - name: Set up ccache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-codegen-clang${{ env.CLANG_VERSION }}

      - name: Download default.xex
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/download-xex
        with:
          url: ${{ secrets.XEX_URL }}
          auth: ${{ secrets.XEX_AUTH }}
          sha256: ${{ secrets.XEX_SHA256 }}

      - name: Configure (game + SDK from source)
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          cmake -S native -B build/codegen -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/rexglue-sdk"

      - name: Build the rexglue codegen tool
        if: steps.lookup.outputs.cache-hit != 'true'
        run: cmake --build build/codegen --target rexglue --parallel

      - name: Run rexglue codegen
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          REXGLUE_BIN="$(find "$GITHUB_WORKSPACE/rexglue-sdk/out" -maxdepth 3 -name rexglue -type f -executable | head -n 1)"
          if [ -z "$REXGLUE_BIN" ]; then
            echo "::error::rexglue codegen binary not found under rexglue-sdk/out"
            exit 1
          fi
          "$REXGLUE_BIN" --version
          "$REXGLUE_BIN" codegen native/onevs100_manifest.toml

      - name: Save the generated sources
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native/generated/default-v5
          key: ${{ needs.codegen-key.outputs.key }}

      - name: Show ccache statistics
        if: always() && steps.lookup.outputs.cache-hit != 'true'
        run: ccache --show-stats || true

  build:
    name: build (${{ matrix.platform }})
    needs: [codegen-key, codegen]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            timeout: 180
            build_dir: build/linux
            artifact: onevs100-linux-amd64
            files: |
              build/linux/onevs100
              build/linux/librexruntime.so
              build/linux/librexgpu-xenos.so
              build/linux/libdxcompiler.so
              build/linux/libdxil.so
              build/linux/content/.keep
              build/linux/onevs100.toml
              build/linux/RUN.md
              build/linux/manifest.txt
              build/linux/launcher
          - platform: windows
            runner: ubuntu-24.04
            timeout: 240
            build_dir: build/win
            artifact: onevs100-win-amd64
            needs_xwin: true
            files: |
              build/win/onevs100.exe
              build/win/rexruntime.dll
              build/win/rexgpu-xenos.dll
              build/win/content/.keep
              build/win/onevs100.toml
              build/win/RUN.md
              build/win/manifest.txt
              build/win/launcher.exe
          - platform: uwp
            runner: ubuntu-24.04
            timeout: 300
            build_dir: build/uwp
            artifact: onevs100-uwp-amd64
            needs_xwin: true
            needs_msvc: true
            needs_sdl_prefix: true
            files: |
              build/uwp/onevs100.exe
              build/uwp/rexruntime.dll
              build/uwp/rexgpu-xenos.dll
              build/uwp/dxcompiler.dll
              build/uwp/dxil.dll
              build/uwp/SDL3.dll
              build/uwp/content/.keep
              build/uwp/onevs100.toml
              build/uwp/RUN.md
              build/uwp/manifest.txt
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            timeout: 180
            build_dir: build/linux-arm64
            artifact: onevs100-linux-arm64
            files: |
              build/linux-arm64/onevs100
              build/linux-arm64/librexruntime.so
              build/linux-arm64/librexgpu-xenos.so
              build/linux-arm64/content/.keep
              build/linux-arm64/onevs100.toml
              build/linux-arm64/RUN.md
              build/linux-arm64/manifest.txt
              build/linux-arm64/launcher
          - platform: mac-arm64
            runner: macos-14
            timeout: 240
            build_dir: build/mac-arm64
            artifact: onevs100-mac-arm64
            files: |
              build/mac-arm64/onevs100
              build/mac-arm64/*.dylib
              build/mac-arm64/vulkan/lib/libvulkan.1.dylib
              build/mac-arm64/vulkan/lib/libMoltenVK.dylib
              build/mac-arm64/vulkan/share/vulkan/icd.d/MoltenVK_icd.json
              build/mac-arm64/content/.keep
              build/mac-arm64/onevs100.toml
              build/mac-arm64/RUN.md
              build/mac-arm64/manifest.txt
              build/mac-arm64/launcher
          - platform: mac-amd64
            runner: macos-15-intel
            timeout: 240
            build_dir: build/mac-amd64
            artifact: onevs100-mac-amd64
            files: |
              build/mac-amd64/onevs100
              build/mac-amd64/*.dylib
              build/mac-amd64/vulkan/lib/libvulkan.1.dylib
              build/mac-amd64/vulkan/lib/libMoltenVK.dylib
              build/mac-amd64/vulkan/share/vulkan/icd.d/MoltenVK_icd.json
              build/mac-amd64/content/.keep
              build/mac-amd64/onevs100.toml
              build/mac-amd64/RUN.md
              build/mac-amd64/manifest.txt
              build/mac-amd64/launcher
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja nasm pkg-config molten-vk vulkan-loader || true
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build nasm pkg-config python3 python3-pip curl unzip git
            if [ "${{ matrix.platform }}" = "linux" ] || [ "${{ matrix.platform }}" = "linux-arm64" ]; then
              sudo apt-get install -y libx11-dev libx11-xcb-dev libxext-dev \
                libxcursor-dev \
                libxrandr-dev libxfixes-dev libxi-dev libxinerama-dev \
                libxss-dev libxkbcommon-dev libxtst-dev libxdamage-dev \
                libxrender-dev libxxf86vm-dev libxcomposite-dev \
                libibus-1.0-dev libwayland-dev \
                wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
                libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
                libudev-dev
            fi
          fi
      - name: Pin CMake
        run: |
          bindir="$(python3 -c 'import os,site; print(os.path.join(site.getuserbase(), "bin"))')"
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user "cmake==$CMAKE_VERSION"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/cmake" --version
      - name: Set up Clang
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-clang
        with:
          version: ${{ env.CLANG_VERSION }}

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-${{ matrix.platform }}-clang${{ env.CLANG_VERSION }}

      - name: Restore MSVC cache (msvc-wine)
        if: matrix.needs_msvc
        id: msvc-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/msvc
          key: msvc-${{ env.MSVC_VERSION }}-${{ env.WINSDK_VERSION_PIN }}-${{ env.MSVC_CACHE_VERSION }}
          restore-keys: msvc-${{ env.MSVC_VERSION }}-${{ env.WINSDK_VERSION_PIN }}-

      - name: Provision MSVC with msvc-wine
        if: matrix.needs_msvc && steps.msvc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y python3 msitools gcab ca-certificates
          command -v msiextract gcab
          git clone --depth 1 https://github.com/mstorsjo/msvc-wine.git "$RUNNER_TEMP/msvc-wine"
          python3 "$RUNNER_TEMP/msvc-wine/vsdownload.py" --accept-license \
            --major "$MSVC_MAJOR" --msvc-version "$MSVC_VERSION" \
            --sdk-version "$WINSDK_VERSION_PIN" \
            --dest "$MSVC_ROOT" --architecture x64 \
            --cache "$RUNNER_TEMP/msvc-dl-cache"
          chmod +x "$RUNNER_TEMP/msvc-wine/install.sh"
          "$RUNNER_TEMP/msvc-wine/install.sh" "$MSVC_ROOT"
          for d in "$MSVC_ROOT/VC/Tools/MSVC" "$MSVC_ROOT/Windows Kits/10/Include" "$MSVC_ROOT/Windows Kits/10/Lib"; do
            if [ ! -d "$d" ]; then
              echo "::error::MSVC install is missing $d"
              exit 1
            fi
          done

      - name: Detect MSVC and Windows SDK versions
        if: matrix.needs_msvc
        run: |
          detected_msvc="$(ls "$MSVC_ROOT/VC/Tools/MSVC/" | grep -E '^[0-9]' | sort -V | tail -n 1)"
          detected_winsdk="$(ls "$MSVC_ROOT/Windows Kits/10/Include/" | grep -E '^[0-9]+\.' | sort -V | tail -n 1)"
          {
            echo "MSVC_DETECTED_VERSION=$detected_msvc"
            echo "WINSDK_DETECTED_VERSION=$detected_winsdk"
          } >> "$GITHUB_ENV"
          if [ "$detected_msvc" != "$MSVC_VERSION" ]; then
            echo "::error::MSVC $detected_msvc is not the pinned $MSVC_VERSION"
            exit 1
          fi
          if [ "$detected_winsdk" != "$WINSDK_VERSION_PIN" ]; then
            echo "::error::Windows SDK $detected_winsdk is not the pinned $WINSDK_VERSION_PIN"
            exit 1
          fi

      - name: Install xwin and splat the Windows SDK
        if: matrix.needs_xwin
        env:
          # Set by the Detect step above on the uwp leg (MSVC is provisioned
          # first, so the splat matches its SDK); empty elsewhere, where xwin
          # splats its default SDK.
          WINSDK_VERSION: ${{ env.WINSDK_DETECTED_VERSION }}
        run: |
          set -euo pipefail
          name="xwin-$XWIN_VERSION-x86_64-unknown-linux-musl"
          url="https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/$name.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "$url"
          # The .sha256 file holds only the hash, without a file name or newline.
          expected="$(curl -fsSL "$url.sha256" | awk '{ print $1 }')"
          echo "$expected  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$name/xwin" /usr/local/bin/xwin
          # xwin 0.10.0 takes --sdk-version before the subcommand, has no
          # --cache-dir flag, and moves (not copies) files out of its default
          # ./.xwin-cache: so it runs from the workspace, otherwise the splat
          # fails with "Invalid cross-device link".
          splat_args=(--accept-license)
          if [ -n "${WINSDK_VERSION:-}" ]; then
            splat_args+=(--sdk-version "${WINSDK_VERSION%.0}")
          fi
          splat_args+=(splat --output "$XWIN_ROOT")
          xwin "${splat_args[@]}"
          for d in "$XWIN_ROOT/crt/include" "$XWIN_ROOT/sdk/include/um" \
                   "$XWIN_ROOT/sdk/lib/um/x86_64" "$XWIN_ROOT/crt/lib/x86_64"; do
            if [ ! -d "$d" ]; then
              echo "::error::xwin splat is missing $d"
              exit 1
            fi
          done

      - name: Restore SDL3-uwp prefix
        if: matrix.needs_sdl_prefix
        id: sdl-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/sdl3-uwp-prefix
          key: sdl3-uwp-${{ needs.codegen-key.outputs.sdk_sha }}-msvc${{ env.MSVC_VERSION }}-sdk${{ env.WINSDK_VERSION_PIN }}
      - name: Install Wine and .NET
        if: matrix.needs_sdl_prefix && steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wine64 winetricks cabextract
          export WINEDEBUG=-all
          winetricks -q dotnet48
      - name: Compile SDL3-uwp with MSVC
        if: matrix.needs_sdl_prefix && steps.sdl-cache.outputs.cache-hit != 'true'
        env:
          MSVC_ROOT: ${{ env.MSVC_ROOT }}
          MSVC_VERSION: ${{ env.MSVC_VERSION }}
          WINSDK_VERSION: ${{ env.WINSDK_VERSION_PIN }}
          WINEDEBUG: -all
        run: |
          set -euo pipefail
          cmake -S rexglue-sdk/thirdparty/sdl3-uwp -B sdl3-uwp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/uwp/msvc-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-uwp-prefix"
          cmake --build sdl3-uwp-build --parallel
          cmake --install sdl3-uwp-build
          if [ ! -f "$GITHUB_WORKSPACE/sdl3-uwp-prefix/bin/SDL3.dll" ] || \
             [ ! -f "$GITHUB_WORKSPACE/sdl3-uwp-prefix/lib/SDL3.lib" ]; then
            echo "::error::SDL3-uwp prefix must hold bin/SDL3.dll and lib/SDL3.lib at its root" >&2
            exit 1
          fi

      - name: Restore the generated sources
        uses: actions/cache/restore@v6
        with:
          path: native/generated/default-v5
          key: ${{ needs.codegen-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Select latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found under /Applications"
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          clang --version
      - name: Configure
        run: |
          args=(
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE"
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
            -DREXSDK_DIR="$GITHUB_WORKSPACE/rexglue-sdk"
          )
          case "${{ matrix.platform }}" in
            windows)
              args+=(-DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/win/clang-cl-toolchain.cmake")
              ;;
            uwp)
              args+=(-DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/uwp/clang-cl-toolchain.cmake"
                     -DREXGLUE_SDL3_UWP_PREFIX="$GITHUB_WORKSPACE/sdl3-uwp-prefix")
              ;;
          esac
          cmake -S native -B "${{ matrix.build_dir }}" -G Ninja "${args[@]}"

      - name: Build onevs100
        run: cmake --build "${{ matrix.build_dir }}" --target onevs100 --parallel

      - name: Build launcher
        if: matrix.platform != 'uwp'
        run: |
          args=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/${{ matrix.build_dir }}"
          )
          if [ "${{ matrix.platform }}" = "windows" ]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/win/clang-cl-toolchain.cmake")
          else
            args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          cmake -S launcher -B "${{ matrix.build_dir }}-launcher" -G Ninja "${args[@]}"
          cmake --build "${{ matrix.build_dir }}-launcher" --parallel

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Stage release files
        run: |
          mkdir -p "${{ matrix.build_dir }}/content"
          touch "${{ matrix.build_dir }}/content/.keep"
          cp RUN.md package/onevs100.toml package/manifest.txt "${{ matrix.build_dir }}/"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  package-linux:
    name: package linux (${{ matrix.artifact }})
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: onevs100-linux-amd64
            out: onevs100-linux-amd64
          - artifact: onevs100-linux-arm64
            out: onevs100-linux-arm64
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - name: Pack tar.xz
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"
          ./tools/packaging/make_tar_xz.sh staged "out/${{ matrix.out }}-$short.tar.xz"
          ls -la out
          listing=$(tar -tJf "out/${{ matrix.out }}-$short.tar.xz")
          grep -qx '1vs100/manifest.txt' <<<"$listing"
          if grep -q 'userdata' <<<"$listing"; then
            echo "userdata leaked into tar" >&2
            exit 1
          fi
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}-package
          path: out/*.tar.xz
          retention-days: 14
          if-no-files-found: error

  package-win-zip:
    name: package windows zip
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
      - name: Check zip tools
        run: command -v zip && command -v unzip
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: onevs100-win-amd64
          path: staged
      - name: Pack zip
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"
          ./tools/packaging/make_win_zip.sh staged "out/1vs100-win-amd64-$short.zip"
          ls -la out
          listing=$(unzip -l "out/1vs100-win-amd64-$short.zip")
          grep -q '1vs100/manifest.txt' <<<"$listing"
          if grep -q 'userdata' <<<"$listing"; then
            echo "userdata leaked into zip" >&2
            exit 1
          fi
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: onevs100-win-amd64-package
          path: out/*.zip
          retention-days: 14
          if-no-files-found: error

  package-win-installer:
    name: package windows installer
    needs: [build]
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: onevs100-win-amd64
          path: staged
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"
          for d in "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6"; do
            if [ -x "$d/ISCC.exe" ]; then
              export PATH="$d:$PATH"
              break
            fi
          done
          command -v iscc || { echo "::error::ISCC not found"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          ./tools/packaging/windows/make_setup.sh staged out "$version"
          mv "out/1vs100-$version-setup.exe" "out/1vs100-win-amd64-$short-setup.exe"
          test -f "out/1vs100-win-amd64-$short-setup.exe"
          ls -la out
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: onevs100-win-installer-package
          path: out/*.exe
          retention-days: 14
          if-no-files-found: error

  package-mac:
    name: package mac (${{ matrix.artifact }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: onevs100-mac-arm64
            runner: macos-14
            out: onevs100-mac-arm64
          - artifact: onevs100-mac-amd64
            runner: macos-15-intel
            out: onevs100-mac-amd64
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staged
      - name: Pack app zip
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"
          ls -la staged || true
          ./tools/packaging/make_mac_app.sh staged "out/${{ matrix.out }}-$short.zip" "$(tr -d '[:space:]' < VERSION)"
          ls -la out
          listing=$(unzip -l "out/${{ matrix.out }}-$short.zip")
          grep -q '1vs100.app/Contents/MacOS/manifest.txt' <<<"$listing"
          grep -q '1vs100.app/Contents/MacOS/vulkan/share/vulkan/icd.d/MoltenVK_icd.json' <<<"$listing"
          grep -q '1vs100.app/Contents/MacOS/vulkan/lib/libvulkan.1.dylib' <<<"$listing"
          grep -q '1vs100.app/Contents/MacOS/vulkan/lib/libMoltenVK.dylib' <<<"$listing"
          if grep -q 'userdata' <<<"$listing"; then
            echo "userdata leaked into mac zip" >&2
            exit 1
          fi
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}-package
          path: out/*.zip
          retention-days: 14
          if-no-files-found: error

  package-uwp:
    name: package uwp appx
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: onevs100-uwp-amd64
          path: staged
      - name: Restore makemsix
        id: makemsix-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/msix-packaging-prefix/bin/makemsix
          key: makemsix-25a65f5c1690930813bcc10cdf1d59fa865f2bb1
      - name: Build makemsix
        if: steps.makemsix-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev libxerces-c-dev libicu-dev zlib1g-dev
          git clone https://github.com/microsoft/msix-packaging.git "$RUNNER_TEMP/msix-packaging"
          git -C "$RUNNER_TEMP/msix-packaging" checkout 25a65f5c1690930813bcc10cdf1d59fa865f2bb1
          # The vendored xerces and SDK sources pin C++14 while current ICU
          # headers need C++17 (see tools/uwp/README.md).
          cmake -S "$RUNNER_TEMP/msix-packaging" -B "$RUNNER_TEMP/msix-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMSIX_PACK=on \
            -DCMAKE_CXX_STANDARD=17
          cmake --build "$RUNNER_TEMP/msix-build" --target makemsix --parallel
          mkdir -p "$GITHUB_WORKSPACE/msix-packaging-prefix/bin"
          cp "$RUNNER_TEMP/msix-build/makemsix" "$GITHUB_WORKSPACE/msix-packaging-prefix/bin/"
          chmod +x "$GITHUB_WORKSPACE/msix-packaging-prefix/bin/makemsix"
      - name: Install pack tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode openssl imagemagick
      - name: Pack and sign appx
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CERT_PFX_B64:-}" ]; then
            echo "$CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            export CERT_PFX="$RUNNER_TEMP/cert.pfx"
          fi
          MAKEMSIX="$GITHUB_WORKSPACE/msix-packaging-prefix/bin/makemsix" \
            tools/package_uwp.sh staged out/uwp
          ls -la out/uwp
          if grep -q "__VERSION__" out/uwp/layout/AppxManifest.xml; then
            echo "version stamp leaked into package" >&2
            exit 1
          fi
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: onevs100-uwp-package
          path: out/uwp/onevs100.appx
          retention-days: 14
          if-no-files-found: error
