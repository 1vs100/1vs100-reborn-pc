# Builds and packages the game for every target. Each target runs
# tools/ci/build.sh and tools/ci/package.sh, the same commands that build it
# locally (see tools/ci/README.md).
#
# `codegen` runs `rexglue codegen` only when no cache entry matches the SDK
# commit, the XEX hash and the codegen config. codegen and the linux-amd64,
# windows and uwp targets run in the image from ci-image.yaml.
#
# Repository secrets:
#   XEX_URL        (required) HTTPS URL of your default.xex.
#   XEX_AUTH       (optional) `Authorization` header for XEX_URL.
#   XEX_SHA256     (required) expected SHA-256 of default.xex.
#   CERT_PFX_B64   (optional) base64 of the UWP code-signing certificate;
#                  without it the appx is signed with a test certificate.
#   CERT_PASSWORD  (optional) password of that certificate.
#
# Fork pull requests cannot read secrets, so every job skips itself there.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  image:
    if: &same-repo github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yaml

  codegen-key:
    name: codegen cache key
    if: *same-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: native
      - name: Derive the key
        id: key
        env:
          XEX_SHA256: ${{ secrets.XEX_SHA256 }}
          CONFIG_HASH: ${{ hashFiles('native/onevs100_manifest.toml', 'native/branch-targets.toml', 'native/boundaries-v3.toml', 'native/switch-fix.toml') }}
        run: |
          set -euo pipefail
          if [ -z "$XEX_SHA256" ]; then
            echo "::error::XEX_SHA256 secret is not set"
            exit 1
          fi
          sdk_sha="$(git ls-tree HEAD rexglue-sdk | awk '{ print $3 }')"
          if [ -z "$sdk_sha" ]; then
            echo "::error::rexglue-sdk submodule pointer is missing"
            exit 1
          fi
          # Job outputs that contain a secret are dropped, so hash it again.
          xex="$(printf '%s' "$XEX_SHA256" | sha256sum | cut -c1-16)"
          echo "key=codegen-$sdk_sha-$xex-$CONFIG_HASH" >> "$GITHUB_OUTPUT"

  codegen:
    needs: [image, codegen-key]
    runs-on: ubuntu-24.04
    container: &image
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 120
    steps:
      - name: Look up the generated sources
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: native/generated/default-v5
          key: ${{ needs.codegen-key.outputs.key }}
          lookup-only: true
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-codegen-${{ hashFiles('tools/ci/versions.env') }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/download-xex
        with:
          url: ${{ secrets.XEX_URL }}
          auth: ${{ secrets.XEX_AUTH }}
          sha256: ${{ secrets.XEX_SHA256 }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        run: tools/ci/codegen.sh
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native/generated/default-v5
          key: ${{ needs.codegen-key.outputs.key }}

  linux-amd64:
    needs: &build-needs [image, codegen-key, codegen]
    runs-on: ubuntu-24.04
    container: *image
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/platform
        with:
          target: linux-amd64
          codegen-key: ${{ needs.codegen-key.outputs.key }}

  windows:
    needs: *build-needs
    runs-on: ubuntu-24.04
    container: *image
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/platform
        with:
          target: windows
          codegen-key: ${{ needs.codegen-key.outputs.key }}
          deps: xwin

  uwp:
    needs: *build-needs
    runs-on: ubuntu-24.04
    container: *image
    timeout-minutes: 300
    env:
      CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/platform
        with:
          target: uwp
          codegen-key: ${{ needs.codegen-key.outputs.key }}
          deps: xwin msvc sdl3-uwp makemsix vclibs

  # The image is x86_64 only, so this target installs the same packages on
  # the runner.
  linux-arm64:
    needs: [codegen-key, codegen]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install the toolchain
        run: |
          set -euo pipefail
          . tools/ci/versions.env
          sudo apt-get update
          xargs -a tools/ci/apt-packages.txt sudo apt-get install -y --no-install-recommends
          tools/ci/install_llvm.sh "$RUNNER_TEMP/llvm"
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user "cmake==$CMAKE_VERSION"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/platform
        with:
          target: linux-arm64
          codegen-key: ${{ needs.codegen-key.outputs.key }}

  mac:
    needs: [codegen-key, codegen]
    name: mac-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install the toolchain
        run: |
          set -euo pipefail
          . tools/ci/versions.env
          brew install ninja nasm pkg-config ccache molten-vk vulkan-loader
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          clang --version
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user "cmake==$CMAKE_VERSION"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/platform
        with:
          target: mac-${{ matrix.arch }}
          codegen-key: ${{ needs.codegen-key.outputs.key }}

  windows-installer:
    needs: [windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: onevs100-windows
          path: zip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build the installer
        run: |
          set -euo pipefail
          export PATH="/c/Program Files (x86)/Inno Setup 6:/c/Program Files/Inno Setup 6:$PATH"
          command -v iscc
          zip=$(ls zip/*.zip)
          unzip -q "$zip" -d staged
          tools/packaging/windows/make_setup.sh staged/1vs100 out "$(tr -d '[:space:]' < VERSION)"
          mv out/*-setup.exe "out/$(basename "$zip" .zip)-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: onevs100-windows-installer
          path: out/*.exe
          retention-days: 14
          if-no-files-found: error
