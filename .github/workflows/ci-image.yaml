# Publishes the build image from tools/ci, tagged by a hash of its inputs.
# build.yaml calls this first, so every run uses the image that matches its
# own checkout. An existing tag is reused.

name: ci-image

on:
  workflow_call:
    outputs:
      ref:
        description: Image reference for jobs.<id>.container
        value: ${{ jobs.publish.outputs.ref }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci
      - name: Build and push when missing
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/1vs100-pc-ci:$(tools/ci/image_tag.sh)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "$ref exists"
          else
            docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$ref" tools/ci
            docker push "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
