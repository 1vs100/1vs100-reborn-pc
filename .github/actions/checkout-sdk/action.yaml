name: Check out rexglue-sdk
description: >-
  Clone the pinned rexglue-sdk branch (SDK_REPO/SDK_REF environment) and
  initialize the submodules a desktop-platform configure needs.

inputs:
  repo:
    description: Repository
    required: false
    default: 'rexglue/rexglue-sdk'

  ref:
    description: Tag or branch of the SDK
    required: false
    default: 'main'

runs:
  using: composite
  steps:
    - name: Check out rexglue-sdk
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: rexglue-sdk
        submodules: 'recursive'

