name: Set up Clang
description: >-
  Install the pinned Clang/LLD/LLVM tools from the upstream LLVM GitHub
  release tarball. Only the needed tools are extracted; the full archive
  unpacks to about 11.5 GB.

inputs:
  version:
    description: Clang major version
    required: true
  llvm_release:
    description: Upstream LLVM release tag version (asset LLVM-<this>-Linux-<arch>.tar.xz)
    required: false
    default: 22.1.8

runs:
  using: composite
  steps:
    - name: Install Clang from LLVM GitHub release
      shell: bash
      env:
        V: ${{ inputs.version }}
        R: ${{ inputs.llvm_release }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=X64 ;;
          aarch64|arm64) arch=ARM64 ;;
          *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
        esac
        p="LLVM-$R-Linux-$arch"
        dest="$RUNNER_TEMP/llvm-$R"
        mkdir -p "$dest"
        # clang, clang++, clang-cl link to clang-$V; lld-link links to lld.
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$R/$p.tar.xz" \
          | tar -xJ -C "$dest" --strip-components=1 --wildcards \
            "$p/bin/clang" "$p/bin/clang++" "$p/bin/clang-cl" "$p/bin/clang-$V" \
            "$p/bin/lld" "$p/bin/lld-link" "$p/bin/llvm-ar" "$p/bin/llvm-lib" \
            "$p/bin/llvm-rc" "$p/bin/llvm-mt" "$p/lib/clang/*"
        echo "$dest/bin" >> "$GITHUB_PATH"
        "$dest/bin/clang" --version
